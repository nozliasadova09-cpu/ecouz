<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoUz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#f3f8f4);--card:var(--tg-theme-secondary-bg-color,#fff);--tx:var(--tg-theme-text-color,#1f2a24);--hint:var(--tg-theme-hint-color,#6b7a72);--g:#1e8e5a;--dk:#0b3d2e;--bd:rgba(128,128,128,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:var(--dk);color:#fff;padding:18px 16px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}header small{color:#cfe8d8;display:block;margin-top:2px}
.pts{background:#f2a93b;color:#3b2a00;font-weight:700;padding:8px 14px;border-radius:20px}
main{padding:14px}
h2{font-size:17px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type{background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;cursor:pointer}
.type span{display:block;font-size:28px;margin-bottom:4px}
.type.on{border-color:var(--g)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--bd)}
.card p{margin:0 0 10px;font-size:14px;color:var(--hint)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:10px}
button.b{width:100%;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:600}
button.s{padding:8px 12px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:14px}
button:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(30,142,90,.15);color:var(--g)}
.tag.w{background:rgba(192,57,43,.15);color:#c0392b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--bd)}
.stat b{display:block;font-size:26px;color:var(--g)}
.empty{color:var(--hint);text-align:center;padding:18px 0;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--hint);padding:10px 0;font-size:12px}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--g);font-weight:700}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><div><h1>EcoUz</h1><small id="hi">Yashil mahalla platformasi</small></div><div class="pts" id="pts">0 ball</div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0b3d2e')}catch(e){}
 const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)document.getElementById('hi').textContent='Salom, '+u.first_name+'!'}
const TYPES=[
 {k:'plastik',n:'Plastik',i:'🧴',t:'Idishni chayib, qopqogʻini ajrating va yassilab topshiring.'},
 {k:'shisha',n:'Shisha',i:'🍾',t:'Idishni chayib, sindirmasdan alohida konteynerga soling.'},
 {k:'qogoz',n:'Qogʻoz',i:'📰',t:'Quruq saqlang, yogʻli yoki ho‘l qogʻozni aralashtirmang.'},
 {k:'metall',n:'Metall',i:'🥫',t:'Banka va qopqoqlarni chayib, ezib topshiring.'},
 {k:'organik',n:'Organik',i:'🍎',t:'Oziq-ovqat qoldigʻini alohida yigʻing, bu kompost uchun xomashyo.'},
 {k:'mato',n:'Mato',i:'👕',t:'Toza va quruq matoni qopga solib topshiring yoki qayta ishlatish uchun bering.'}];
const KEY='ecouz_v1';
let S={pts:0,kg:0,log:[],trees:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,today=()=>new Date().toISOString().slice(0,10);
let tab='waste',sel=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);try{tg&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
function add(p){S.pts+=p;save()}
function wateredToday(t){return t.last===today()}
function daysSince(d){return Math.floor((Date.now()-new Date(d).getTime())/DAY)}
function level(p){return p>=1000?'Eko-qahramon':p>=400?'Yashil faol':p>=100?'Eko-boshlovchi':'Yangi ishtirokchi'}
function wasteView(){
 const ty=TYPES.find(x=>x.k===sel);
 return `<h2>Nima topshirmoqchisiz?</h2><div class="grid">${TYPES.map(x=>`<div class="type ${x.k===sel?'on':''}" onclick="pick('${x.k}')"><span>${x.i}</span>${x.n}</div>`).join('')}</div>
 ${ty?`<div class="card"><p>${ty.t}</p><input id="kg" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="Ogʻirligi (kg)"><button class="b" onclick="submitWaste()">Topshirdim (+10 ball/kg)</button></div>`:'<div class="empty">Chiqindi turini tanlang</div>'}
 <h2>Oxirgi topshirishlar</h2>${S.log.length?S.log.slice(0,5).map(l=>`<div class="card row"><span>${esc(l.n)} · ${l.kg} kg</span><span class="tag">+${l.p}</span></div>`).join(''):'<div class="empty">Hali topshirmadingiz</div>'}`}
function treeView(){
 return `<h2>Daraxt ekdim</h2><div class="card"><input id="tn" maxlength="30" placeholder="Daraxt nomi yoki joyi (masalan: Chinor, maktab hovlisi)"><button class="b" onclick="addTree()">Ro‘yxatga qo‘shish (+50 ball)</button></div>
 <h2>Mening daraxtlarim</h2>${S.trees.length?S.trees.map((t,i)=>{const d=daysSince(t.last||t.date),need=d>=3&&!wateredToday(t);return `<div class="card"><div class="row"><b>🌳 ${esc(t.name)}</b><span class="tag ${need?'w':''}">${need?'Sugʻorish kerak':'Yaxshi'}</span></div><p style="margin:6px 0 10px">Ekilganiga ${daysSince(t.date)} kun · oxirgi sugʻorish ${d} kun oldin</p><button class="s" ${wateredToday(t)?'disabled':''} onclick="water(${i})">💧 Sugʻordim (+5)</button></div>`}).join(''):'<div class="empty">Birinchi daraxtingizni qo‘shing</div>'}`}
function statView(){
 const alive=S.trees.filter(t=>daysSince(t.last||t.date)<7).length;
 return `<h2>Mening natijam</h2><div class="stats"><div class="stat"><b>${S.pts}</b>ball</div><div class="stat"><b>${(Math.round(S.kg*10)/10)}</b>kg chiqindi</div><div class="stat"><b>${S.trees.length}</b>daraxt</div><div class="stat"><b>${alive}</b>parvarishlanayotgan</div></div>
 <div class="card"><p>Darajangiz</p><b style="font-size:20px">${level(S.pts)}</b></div>
 <div class="card"><p>Ballarni mahalladagi hamkor do‘konlarda chegirmaga almashtirish keyingi versiyada qo‘shiladi.</p></div>`}
function render(){
 document.getElementById('app').innerHTML=tab==='waste'?wasteView():tab==='tree'?treeView():statView();
 document.getElementById('pts').textContent=S.pts+' ball';
 document.getElementById('nav').innerHTML=[['waste','♻️','Chiqindi'],['tree','🌳','Daraxt'],['stat','📊','Natija']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(t){tab=t;render()}
function pick(k){sel=k;render()}
function submitWaste(){const v=parseFloat(document.getElementById('kg').value);if(!(v>0)){toast('Ogʻirlikni kiriting');return}
 const ty=TYPES.find(x=>x.k===sel),p=Math.round(v*10);S.kg+=v;S.log.unshift({n:ty.n,kg:v,p});S.log=S.log.slice(0,20);add(p);toast('+'+p+' ball!');sel=null;render()}
function addTree(){const n=document.getElementById('tn').value.trim();if(!n){toast('Nom kiriting');return}
 S.trees.unshift({name:n,date:today(),last:null});add(50);toast('+50 ball!');render()}
function water(i){const t=S.trees[i];if(wateredToday(t))return;t.last=today();add(5);toast('+5 ball');render()}
render();
</script>
</body>
</html>
